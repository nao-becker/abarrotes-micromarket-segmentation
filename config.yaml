project:
  name: abarrotes-micromarket-segmentation
  random_seed: 42

region:
  name: ZMVM
  # INEGI state codes: 09 = Mexico City, 15 = State of Mexico, 13 = Hidalgo
  states: ["09", "15", "13"]
  # Municipalities per state (INEGI 3-digit codes). "all" = whole state.
  # The ZMVM municipality list for 15 and 13 is filled in S2 from the official
  # metropolitan-area delimitation. To scale to another state, change this block.
  municipalities:
    "09": all
    "13": ["013", "069"]    # Atotonilco de Tula, Tizayuca
    "15": ["002", "011", "013", "020", "022", "023", "024", "025", "028", "029",
           "030", "031", "033", "035", "037", "038", "039", "044", "046", "053",
           "057", "058", "059", "060", "069", "070", "075", "081", "083", "084",
           "089", "091", "092", "093", "095", "099", "100", "103", "104", "108",
           "109", "120", "121", "122", "125"]


stores:
  scian_target: ["461110"]   # retail tiendas de abarrotes (confirmed against DENUE in S2)
  competition_radius_m: 500

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
  figures: reports/figures
